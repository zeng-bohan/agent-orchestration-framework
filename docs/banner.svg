<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 180" width="800" height="180">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a2332;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f43f5e;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="180" fill="url(#bg3)"/>
  <g stroke="#1e293b" stroke-width="0.5" opacity="0.5">
    <line x1="0" y1="30" x2="800" y2="30"/>
    <line x1="0" y1="60" x2="800" y2="60"/>
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
  </g>
  <!-- DAG nodes -->
  <g>
    <circle cx="60" cy="90" r="18" fill="#1e3a5f" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="60" y="94" fill="#f59e0b" font-family="Arial,sans-serif" font-size="10" text-anchor="middle" font-weight="bold">A</text>
    
    <line x1="78" y1="90" x2="140" y2="60" stroke="#334155" stroke-width="1.5"/>
    <line x1="78" y1="90" x2="140" y2="120" stroke="#334155" stroke-width="1.5"/>
    
    <circle cx="160" cy="60" r="18" fill="#1e3a5f" stroke="#818cf8" stroke-width="1.5"/>
    <text x="160" y="64" fill="#818cf8" font-family="Arial,sans-serif" font-size="10" text-anchor="middle" font-weight="bold">B</text>
    
    <circle cx="160" cy="120" r="18" fill="#1e3a5f" stroke="#818cf8" stroke-width="1.5"/>
    <text x="160" y="124" fill="#818cf8" font-family="Arial,sans-serif" font-size="10" text-anchor="middle" font-weight="bold">C</text>
    
    <line x1="178" y1="60" x2="240" y2="90" stroke="#334155" stroke-width="1.5"/>
    <line x1="178" y1="120" x2="240" y2="90" stroke="#334155" stroke-width="1.5"/>
    
    <circle cx="260" cy="90" r="18" fill="#1e3a5f" stroke="#34d399" stroke-width="1.5"/>
    <text x="260" y="94" fill="#34d399" font-family="Arial,sans-serif" font-size="10" text-anchor="middle" font-weight="bold">D</text>
    
    <!-- Checkpoint indicator -->
    <rect x="320" y="65" width="100" height="50" rx="8" fill="#0f2922" stroke="#34d399" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="370" y="85" fill="#34d399" font-family="Arial,sans-serif" font-size="10" text-anchor="middle">SQLite Checkpoint</text>
    <text x="370" y="103" fill="#64748b" font-family="Arial,sans-serif" font-size="8" text-anchor="middle">断点续传 · 失败重试</text>
    
    <!-- MCP tools -->
    <rect x="470" y="65" width="100" height="50" rx="8" fill="#1a1a2e" stroke="#a78bfa" stroke-width="1"/>
    <text x="520" y="85" fill="#a78bfa" font-family="Arial,sans-serif" font-size="10" text-anchor="middle">MCP Registry</text>
    <text x="520" y="103" fill="#64748b" font-family="Arial,sans-serif" font-size="8" text-anchor="middle">stdio · SSE · 热插拔</text>
    
    <!-- Skills -->
    <rect x="620" y="65" width="100" height="50" rx="8" fill="#1a1a2e" stroke="#fbbf24" stroke-width="1"/>
    <text x="670" y="85" fill="#fbbf24" font-family="Arial,sans-serif" font-size="10" text-anchor="middle">Skills Discovery</text>
    <text x="670" y="103" fill="#64748b" font-family="Arial,sans-serif" font-size="8" text-anchor="middle">SKILL.md 自动注册</text>
    
    <!-- Title -->
    <text x="400" y="145" fill="url(#accent3)" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" font-weight="bold">agentflow — Agent Orchestration Framework</text>
    <text x="400" y="165" fill="#64748b" font-family="Arial,sans-serif" font-size="11" text-anchor="middle">DAG Graph · StateGraph · SQLite Checkpoint · MCP · Skills · 89% Coverage</text>
  </g>
